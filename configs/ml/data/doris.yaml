data_dir: ${hydra:runtime.cwd}/data/raw/spacetrack
data_dir_labels : ${hydra:runtime.cwd}/data/parsed/labelled_leo_DORIS
dataset : 'leo_doris'
val_split: 0.2 ## utilisé seulement si fold est null

## k-fold groupé par objet. fold null -> split simple par val_split.
## n_folds null -> leave-one-object-out (13 folds sur les objets exploitables).
fold : null
n_folds : null

## Fenetre de 512 TLE = la window_size du pretrain MAEv3 : la table d'embeddings positionnels
## de l'encodeur fait 512/16 = 32 lignes et ne se charge que sur une fenetre de meme geometrie.
## history + future + 1 = 512, la cible restant au centre.
history: 256
future : 255

## true -> ANCIEN jeu de features (p, q au lieu de i_continue/cosRAAN/sinRAAN), pour finetuner
## sur les checkpoints de pretrain existants, qui ont ete entraines dessus. A repasser a false
## une fois qu'un pretrain aura tourne sur les nouvelles features.
legacy_angles : true
