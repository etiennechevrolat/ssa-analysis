name : maneuver_finetune

## Les params reprennent l'ENCODEUR du MAEv3 (cf. model/MAEv3.yaml) : ils doivent correspondre
## exactement, sinon load_state_dict echoue sur les shapes — ou pire, passe silencieusement.
## C'est le cas de n_attn_heads : les projections Q/K/V sont (embed_dim, embed_dim) quel que
## soit le nombre de tetes, donc un mauvais decoupage se charge sans erreur et calcule autre chose.
patch_size : 16
embed_dim : 128  
n_attn_heads : 8       
n_blocks : 12          
expansion_factor : 4  
dropout_rate : 0.0
head_dropout_rate: 0.5
