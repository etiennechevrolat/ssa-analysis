name : finetuning

## demi-largeur des bosses de la cible, et tolérance d'appariement, en HEURES.
## Converties en indices TLE objet par objet : la cadence varie d'un facteur ~4 entre
## satellites (dt médian 6,8h pour 25260, 24,4h pour 22076), donc une valeur en indices
## ne représente pas la même durée d'un objet à l'autre.
half_width_hours : 48.0
tolerance_hours : 48.0

## true -> cible unique 'manoeuvre' (les 4 canaux type/intensité fusionnés).
## Concentre les ~1300 manoeuvres sur la détection au lieu de les éclater sur 4 canaux
## dont le plus rare n'a que 44 exemples.
detection_only : False

ckpt_path : null
freeze_encoder : True
bstar_factor_k : 1.0

## Planchers d'exclusion d'un objet, appliques AVANT le decoupage en folds : en leave-one-out
## chaque objet retenu devient un fold, donc un objet insignifiant ne degrade pas seulement
## l'entrainement, il ajoute a la moyenne un F2 qui ne mesure rien.
min_tle : null        ## null -> une fenetre complete (history + future + 1)
min_maneuvers : 1     ## nombre de manoeuvres exploitables, au sens de gt_events_doris
